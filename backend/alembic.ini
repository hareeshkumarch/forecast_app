[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is injected from SYNC_DATABASE_URL in migrations/env.py; this value
# is only a placeholder so the file is valid standalone.
sqlalchemy.url = postgresql+psycopg://forecasting:forecasting@localhost:5432/forecasting
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
