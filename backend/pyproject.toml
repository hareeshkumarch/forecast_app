[project]
name = "forecasting-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async antipatterns
    "LOG",    # logging misuse
    "G",      # logging call style
    "T20",    # stray print()
    "ARG",    # unused arguments
    "PIE",    # misc lints
    "RET",    # return simplification
    "TID",    # tidy imports
]
ignore = [
    # Long strings in seed and insight copy are clearer left on one line.
    "E501",
    # FastAPI's Depends()/File() defaults are function calls by design.
    "B008",
    # `else` after `return` often reads better in scoring branches.
    "RET505",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures and helpers legitimately accept arguments they do not use.
"tests/*" = ["ARG001", "ARG002"]
# Forecaster and connector implementations must match their protocol signatures
# even when a particular implementation ignores an argument.
"app/forecasting/models.py" = ["ARG002"]
"app/connectors/*.py" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true

# mypy cannot see through Pydantic's @computed_field stacked on @property.
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
# Migrations are generated; tests use fixtures that fight strict annotations.
module = ["migrations.*", "tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Database drivers and forecasting libraries that ship no type information.
module = ["pymysql.*", "pymssql.*", "psycopg2.*", "prophet.*", "statsmodels.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 22 minutes serial, under four in parallel. A suite nobody waits for is a
# suite that gets run. `-n0` puts it back on one process for a debugger.
addopts = "-n auto"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: fits real models repeatedly; the latency SLO rests on these",
]
