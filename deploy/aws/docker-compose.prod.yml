# Production compose for a single AWS instance.
#
# This is the dev compose with three things taken out and two put in.
#
# Taken out:
#   frontend — it is a static export on S3, served by CloudFront. Nothing on
#              this box needs Node.
#   redis    — the platform only needs a broker when Celery is doing the
#   worker     fitting. FORECAST_WORKERS drives an in-process pool instead,
#              which is the documented single-node default and saves ~500 MB
#              of RAM on an instance that has 2 GB of it.
#
# Put in:
#   memory limits, so nothing on the box can starve the API
#   log rotation, so a long-running instance cannot fill its own disk
#
# Two ways to run it, decided by whether SUPABASE_DB_URL is set in .env:
#
#   # Supabase is the store of record — nothing else to start
#   docker compose -f deploy/aws/docker-compose.prod.yml up -d --build
#
#   # no Supabase: bring up the local Postgres alongside the API
#   docker compose -f deploy/aws/docker-compose.prod.yml --profile localdb up -d --build
#
# The Supabase path is the better one on a 2 GB box: it hands ~512 MB back to
# the forecasting pool and moves backups onto someone else's rota.

services:
  postgres:
    # Only started with `--profile localdb`. With Supabase configured this
    # service is dead weight — production refuses the fallback anyway (see
    # DATABASE_FALLBACK_ENABLED below), so an unused Postgres would sit there
    # holding memory that the fit stage wants.
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecasting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecasting}
      POSTGRES_DB: ${POSTGRES_DB:-forecasting}
    # Deliberately no `ports:`. The database is reachable over the compose
    # network and from nowhere else — there is no security group rule that
    # would make 5432 safe on a public instance.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecasting} -d ${POSTGRES_DB:-forecasting}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
    image: ${BACKEND_IMAGE:-forecast-backend:local}
    # Port 80 on the host, so the security group has one rule and CloudFront
    # can use the default HTTP port. The container still listens on 8000.
    ports:
      - "80:8000"
    environment:
      APP_ENV: production
      # Supabase, when SUPABASE_DB_URL is set in .env; the local postgres
      # service below when it is not. Both paths are already supported.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Must be false whenever APP_ENV=production — config.py raises on the
      # combination and the API will not start. That is deliberate: a
      # half-reachable Supabase would otherwise split writes onto a local node
      # that nothing reads, and you would not find out until the numbers
      # disagreed. Fail the boot instead.
      DATABASE_FALLBACK_ENABLED: "false"
      STORAGE_ROOT: /storage
      # Uploads are copied here as they arrive, over S3. Empty means local
      # disk only, which is the default — see app/core/object_store.py.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_REGION: ${STORAGE_REGION:-ap-south-1}
      # CloudFront serves the app and the API from one distribution, so every
      # browser request is same-origin and CORS never comes up. The value is
      # here for the case where you point a second origin at this box.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Not `:?` any more. That refused to start the stack when the value was
      # absent from this file, which is exactly the state a deployment reading
      # its secrets from Infisical is in: compose interpolates on the host,
      # before the container exists and long before anything has talked to a
      # secret manager. The guard has not been dropped, it has moved to where
      # it can see the real value — config.py refuses to boot in production on
      # a default or short key, after hydration, which is the check that was
      # wanted all along.
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      # One pool worker per vCPU. On a 2-vCPU instance leave this at 2: the
      # fit stage has a 28-second budget and a single worker will miss it.
      FORECAST_WORKERS: ${FORECAST_WORKERS:-2}
      # Off by default here, unlike the dev compose. Seeding writes a demo
      # dataset into whatever this deployment calls its store of record, and
      # on this file that is somebody's real Supabase project. A default that
      # is merely inconvenient in development is contamination in production.
      RUN_SEED_ON_STARTUP: ${RUN_SEED_ON_STARTUP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      # Empty: without a broker the API fits in-process. Setting these would
      # require the redis and worker services this file deliberately omits.
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND: ""
      REDIS_URL: ""

      # ---- sign-in ---------------------------------------------------------
      # Every variable this file does not name is one the container never sees,
      # whatever /opt/forecast/.env holds. Adding a setting to the application
      # and not to this list produces the worst possible symptom: the feature
      # reads as switched off, the file says it is on, and nothing disagrees
      # out loud.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_REQUIRE_APPROVAL: ${AUTH_REQUIRE_APPROVAL:-true}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_ALLOWLIST: ${AUTH_ALLOWLIST:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}

      # ---- approval email --------------------------------------------------
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

      # ---- secrets ---------------------------------------------------------
      # The four that cannot live in the secret manager, because they are what
      # opens it.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_HOST: ${INFISICAL_HOST:-}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-}
    volumes:
      # Uploads, generated Parquet and exports. On EBS, so they survive a
      # container rebuild and are captured by the instance's snapshots.
      - /opt/forecast/storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
        # Without the localdb profile there is no Postgres to wait for, and
        # the API should start anyway — Supabase is the store of record.
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          # Leaves ~1.2 GB for the API and its two fitting processes on a
          # 2 GB instance, with the rest for Postgres and the host.
          memory: 1400M
    logging: *logging
    restart: unless-stopped

volumes:
  postgres-data:
