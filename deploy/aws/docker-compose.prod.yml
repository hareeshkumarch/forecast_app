# Production compose for a single AWS instance.
#
# This is the dev compose with three things taken out and two put in.
#
# Taken out:
#   frontend — it is a static export on S3, served by CloudFront. Nothing on
#              this box needs Node.
#   redis    — the platform only needs a broker when Celery is doing the
#   worker     fitting. FORECAST_WORKERS drives an in-process pool instead,
#              which is the documented single-node default and saves ~500 MB
#              of RAM on an instance that has 2 GB of it.
#
# Put in:
#   memory limits, so nothing on the box can starve the API
#   log rotation, so a long-running instance cannot fill its own disk
#
# Two ways to run it, decided by whether SUPABASE_DB_URL is set in .env:
#
#   # Supabase is the store of record — nothing else to start
#   docker compose -f deploy/aws/docker-compose.prod.yml up -d --build
#
#   # no Supabase: bring up the local Postgres alongside the API
#   docker compose -f deploy/aws/docker-compose.prod.yml --profile localdb up -d --build
#
# The Supabase path is the better one on a 2 GB box: it hands ~512 MB back to
# the forecasting pool and moves backups onto someone else's rota.

services:
  postgres:
    # Only started with `--profile localdb`. With Supabase configured this
    # service is dead weight — production refuses the fallback anyway (see
    # DATABASE_FALLBACK_ENABLED below), so an unused Postgres would sit there
    # holding memory that the fit stage wants.
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecasting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecasting}
      POSTGRES_DB: ${POSTGRES_DB:-forecasting}
    # Deliberately no `ports:`. The database is reachable over the compose
    # network and from nowhere else — there is no security group rule that
    # would make 5432 safe on a public instance.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecasting} -d ${POSTGRES_DB:-forecasting}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    # Time docker allows for a SIGTERM to be honoured before it sends SIGKILL.
    # The default is ten seconds, which is less than the shutdown drain — so
    # without this the API is killed part-way through waiting for the forecasts
    # already running to finish, and the wait buys nothing at all. Kept under
    # systemd's default TimeoutStopSec of 90s, which bounds the whole chain.
    stop_grace_period: 60s
    build:
      context: ../../backend
    image: ${BACKEND_IMAGE:-forecast-backend:local}
    # Port 80 on the host, so the security group has one rule and CloudFront
    # can use the default HTTP port. The container still listens on 8000.
    ports:
      - "80:8000"
    environment:
      APP_ENV: production
      # Supabase, when SUPABASE_DB_URL is set in .env; the local postgres
      # service below when it is not. Both paths are already supported.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Must be false whenever APP_ENV=production — config.py raises on the
      # combination and the API will not start. That is deliberate: a
      # half-reachable Supabase would otherwise split writes onto a local node
      # that nothing reads, and you would not find out until the numbers
      # disagreed. Fail the boot instead.
      DATABASE_FALLBACK_ENABLED: "false"
      STORAGE_ROOT: /storage
      # Uploads are copied here as they arrive, over S3. Empty means local
      # disk only, which is the default — see app/core/object_store.py.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_REGION: ${STORAGE_REGION:-ap-south-1}
      # CloudFront serves the app and the API from one distribution, so every
      # browser request is same-origin and CORS never comes up. The value is
      # here for the case where you point a second origin at this box.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Not `:?` any more. That refused to start the stack when the value was
      # absent from this file, which is exactly the state a deployment reading
      # its secrets from Infisical is in: compose interpolates on the host,
      # before the container exists and long before anything has talked to a
      # secret manager. The guard has not been dropped, it has moved to where
      # it can see the real value — config.py refuses to boot in production on
      # a default or short key, after hydration, which is the check that was
      # wanted all along.
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      # These multiply, so on a two-core box their product should be two. One
      # run at a time using both cores beats two runs each on one core: the
      # person waiting sees their own run finish sooner, and a second run is
      # rare on a single-team deployment. Runs past the first are queued and
      # told their position rather than left looking stuck.
      #
      # FORECAST_MODEL_CONCURRENCY has to be here, and was not. The engine
      # backtests candidates on THREADS whenever it is above 1 and only falls
      # through to FORECAST_CANDIDATE_WORKERS below that — and a variable this
      # file does not name is one the container never sees, so it kept its
      # default of 2 and the line under it has never once been read. Exactly
      # the symptom the note further down warns about: the file said one thing
      # and the machine did another, with nothing disagreeing out loud.
      FORECAST_WORKERS: ${FORECAST_WORKERS:-1}
      FORECAST_MODEL_CONCURRENCY: ${FORECAST_MODEL_CONCURRENCY:-1}
      FORECAST_CANDIDATE_WORKERS: ${FORECAST_CANDIDATE_WORKERS:-2}
      # Threads each worker's linear algebra may take. OpenBLAS sizes its pool
      # from the core count PER PROCESS, so without this the candidate
      # processes above each ask for two more and four threads contend for two
      # cores — every fit slower than it would have been alone, worst for
      # whatever started last.
      FORECAST_BLAS_THREADS: ${FORECAST_BLAS_THREADS:-1}
      # Off by default here, unlike the dev compose. Seeding writes a demo
      # dataset into whatever this deployment calls its store of record, and
      # on this file that is somebody's real Supabase project. A default that
      # is merely inconvenient in development is contamination in production.
      RUN_SEED_ON_STARTUP: ${RUN_SEED_ON_STARTUP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json

      # ---- what this box advertises and what it measures --------------------
      # Mixed into every cache validator, so setting this to the release being
      # deployed invalidates each browser's stored copy exactly once. Left at
      # the default it still works; it just means a response that keeps its
      # shape and changes a number has no signal to travel on.
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # /api/health/metrics, in Prometheus' text format. The token is what
      # makes it readable: with it empty this deployment is in production, so
      # every scrape is refused and the boot log says so. Generate one with
      # `openssl rand -hex 32`.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Requests in flight before the API answers 503 rather than queueing.
      # Health checks and the progress streams are exempt, so a busy box still
      # reports alive to the load balancer and open dashboards keep streaming.
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-64}
      # Live connections one account may hold, and how many this process will
      # hold at once. Streams are exempt from the ceiling above — they are held
      # rather than served — so these are the only thing bounding them.
      # A statement with nothing to stop it holds one of ten pooled connections
      # for as long as it takes. Reads take the first; the sessions that
      # persist a run take the second, because a grouped forecast writes tens
      # of thousands of rows and that is slow rather than stuck.
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-30}
      DB_WRITE_TIMEOUT_SECONDS: ${DB_WRITE_TIMEOUT_SECONDS:-300}
      # How long a redeploy waits for the forecasts already running. Must fit
      # inside stop_grace_period above, which must fit inside the unit's
      # TimeoutStopSec.
      SHUTDOWN_DRAIN_SECONDS: ${SHUTDOWN_DRAIN_SECONDS:-45}
      # Off. Read GET /api/health/storage and GET /api/forecasts/retention
      # before turning it on — both answer while it is off, which is the point.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_RUN_DAYS: ${RETENTION_RUN_DAYS:-90}
      RETENTION_KEEP_RUNS: ${RETENTION_KEEP_RUNS:-20}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      RETENTION_BATCH: ${RETENTION_BATCH:-10}
      SSE_MAX_STREAMS_PER_CLIENT: ${SSE_MAX_STREAMS_PER_CLIENT:-8}
      SSE_MAX_STREAMS_TOTAL: ${SSE_MAX_STREAMS_TOTAL:-256}
      SSE_MAX_LIFETIME_SECONDS: ${SSE_MAX_LIFETIME_SECONDS:-1800}
      # How many proxies of ours stand in front of the API. The client is read
      # that many places from the RIGHT of X-Forwarded-For — CloudFront appends
      # the viewer to whatever the viewer sent, so reading the left of it reads
      # a value the caller chose and one header mints a fresh rate-limit
      # window. One is right for CloudFront alone.
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      # Addresses whose forwarding headers are believed at all. Empty believes
      # them from anywhere, which is only safe once nothing can reach this
      # origin except through CloudFront.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      # Dashboard aggregates, cached under a key carrying the run's own
      # revision. Memory knobs, not correctness knobs — an entry cannot go
      # stale, only unused.
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-300}
      DASHBOARD_CACHE_MAX_ENTRIES: ${DASHBOARD_CACHE_MAX_ENTRIES:-600}
      # Empty: without a broker the API fits in-process. Setting these would
      # require the redis and worker services this file deliberately omits.
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND: ""
      REDIS_URL: ""

      # ---- sign-in ---------------------------------------------------------
      # Every variable this file does not name is one the container never sees,
      # whatever /opt/forecast/.env holds. Adding a setting to the application
      # and not to this list produces the worst possible symptom: the feature
      # reads as switched off, the file says it is on, and nothing disagrees
      # out loud.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_REQUIRE_APPROVAL: ${AUTH_REQUIRE_APPROVAL:-true}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_ALLOWLIST: ${AUTH_ALLOWLIST:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}

      # ---- approval email --------------------------------------------------
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

      # ---- secrets ---------------------------------------------------------
      # The four that cannot live in the secret manager, because they are what
      # opens it.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_HOST: ${INFISICAL_HOST:-}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-}
    volumes:
      # Uploads, generated Parquet and exports. On EBS, so they survive a
      # container rebuild and are captured by the instance's snapshots.
      - /opt/forecast/storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
        # Without the localdb profile there is no Postgres to wait for, and
        # the API should start anyway — Supabase is the store of record.
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          # Leaves ~1.2 GB for the API and its two fitting processes on a
          # 2 GB instance, with the rest for Postgres and the host.
          memory: 1400M
    logging: *logging
    restart: unless-stopped

volumes:
  postgres-data:
