name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend · ruff & mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff check
        working-directory: backend
        run: ruff check --output-format=github .

      - name: ruff format
        working-directory: backend
        run: ruff format --check --diff .

      - name: mypy
        working-directory: backend
        run: mypy

  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        working-directory: backend
        run: pytest -q --durations=10

  migrations:
    name: Backend · migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecasting
          POSTGRES_PASSWORD: forecasting
          POSTGRES_DB: forecasting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecasting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_DATABASE_URL: postgresql+psycopg://forecasting:forecasting@localhost:5432/forecasting
      DATABASE_URL: postgresql+asyncpg://forecasting:forecasting@localhost:5432/forecasting
      STORAGE_ROOT: /tmp/forecast-storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply every migration to an empty database
        working-directory: backend
        run: alembic upgrade head

      - name: Fail if a model has drifted from the migrations
        working-directory: backend
        run: alembic check

      - name: Roll all the way back and forward again
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      # The suite runs on SQLite, which stores anything. Postgres does not: a
      # NaN metric or an -Infinity in a JSON column fails the insert outright,
      # and an all-zero series produces both. These are the tests that write
      # such a run, so they run once more here against the real engine.
      - name: Store an unmeasurable run against Postgres
        working-directory: backend
        env:
          RUN_AGAINST_POSTGRES: "1"
        # -n 0 overrides the `-n auto` in pyproject. On SQLite each worker gets
        # its own file, because conftest names the database after a per-process
        # temp directory. Against Postgres they all share the one service
        # container, so the schema each worker creates and drops is the schema
        # the others are mid-INSERT against: an INSERT INTO forecast_runs
        # deadlocks with another worker's DROP TABLE schema_mappings, and three
        # of these nine fail. Nine tests do not need the parallelism anyway.
        run: pytest -q --no-header -n 0 -k "zeros or too_short or leading_column"

  worker:
    name: Backend · Celery round trip
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/2
      CREDENTIAL_SECRET_KEY: ci-only-not-a-real-secret
      STORAGE_ROOT: /tmp/forecast-storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch a forecast to a real worker
        working-directory: backend
        # -n 0 overrides the `-n auto` in pyproject, and it is load-bearing.
        # The worker fixture is module-scoped, so each xdist process starts its
        # own Celery worker — and every one of them consumes the same
        # `forecasts` queue on the same broker while conftest gives each its
        # own SQLite file. A task dispatched by one process is then picked up
        # by another, which cannot find the run, fails it in under two seconds
        # and publishes nothing, so the dispatcher waits out all 240 seconds.
        # Whether that happened came down to whether xdist put both tests on
        # one process, which is why this passed and failed at random.
        run: pytest -q tests/test_worker_roundtrip.py --no-header -n 0

  frontend-checks:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    # The same Postgres the migrations job uses, so the browser is driving the
    # schema that ships rather than a convenience one built from the models.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecasting
          POSTGRES_PASSWORD: forecasting
          POSTGRES_DB: forecasting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecasting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://forecasting:forecasting@localhost:5432/forecasting
      SYNC_DATABASE_URL: postgresql+psycopg://forecasting:forecasting@localhost:5432/forecasting
      STORAGE_ROOT: /tmp/forecast-e2e-storage
      CREDENTIAL_SECRET_KEY: e2e-only-not-a-real-secret
      CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
      FORECAST_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the backend
        working-directory: backend
        run: pip install -r requirements.txt

      # These are dashboard tests, and a dashboard with nothing on it has no
      # layout to measure. Seeding runs a real forecast, so the panels, the
      # insights rail and the header's run controls all exist by the time
      # Playwright looks for them.
      - name: Create the schema and put a real forecast behind it
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.database.seed

      - name: Start the API
        working-directory: backend
        run: |
          # Fully detached, or the server dies with the shell this step runs in.
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/e2e-api.log" 2>&1 < /dev/null &
          disown
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/api/health > /dev/null; then
              # A server that answers is not the same as one with a forecast to
              # show, and these tests measure a populated dashboard.
              curl -fs http://127.0.0.1:8000/api/forecasts \
                | grep -q '"status":"completed"' && exit 0
            fi
            sleep 2
          done
          echo "The API never came up with a completed run:" >&2
          cat "$RUNNER_TEMP/e2e-api.log" >&2
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          API_BASE_URL: http://127.0.0.1:8000

      - name: The backend log, if anything failed
        if: failure()
        run: cat "$RUNNER_TEMP/e2e-api.log" || true

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-lint, backend-tests, migrations, worker, frontend-checks, e2e, docker]
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "backend-lint      ${{ needs.backend-lint.result }}"
          echo "backend-tests     ${{ needs.backend-tests.result }}"
          echo "migrations        ${{ needs.migrations.result }}"
          echo "worker            ${{ needs.worker.result }}"
          echo "frontend-checks   ${{ needs.frontend-checks.result }}"
          echo "e2e               ${{ needs.e2e.result }}"
          echo "docker            ${{ needs.docker.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
