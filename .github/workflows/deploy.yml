name: Deploy

# The backend is a container on one EC2 instance, redeployed by a script that
# already lives on the box. This runs that script over SSM when main goes
# green, so a merge reaches production without anyone opening a session.
#
# It waits for CI rather than triggering on push, and it deploys the exact
# commit CI passed on rather than whatever main happens to be by the time the
# instance fetches — two merges a minute apart would otherwise deploy the
# second commit twice and never report on the first.
#
# The frontend is not here: Vercel deploys it from its own git integration.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy"
        required: false
        default: main

# Never two deploys at once, and never cancel one in flight: the script is
# mid-rebuild on a two-vCPU box, and killing the job here would not stop it
# there — it would only take away the log that says how it ended.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Should we deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.decide.outputs.ready }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Decide
        id: decide
        env:
          # Secrets cannot be read in a job-level `if`, so the check happens
          # here and the deploy job gates on the answer.
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          # Read through the environment, never interpolated into the script:
          # this one is typed by whoever can press the button, and it ends up
          # inside a command that runs as root on the instance.
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "CI concluded '$CONCLUSION' — not deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [ -n "$ROLE" ]     || missing="$missing AWS_DEPLOY_ROLE_ARN(secret)"
          [ -n "$INSTANCE" ] || missing="$missing EC2_INSTANCE_ID(secret)"
          [ -n "$REGION" ]   || missing="$missing AWS_REGION(variable)"

          if [ -n "$missing" ]; then
            {
              echo "### Auto-deploy is not configured"
              echo
              echo "Set the following under **Settings → Secrets and variables → Actions**, then this runs on every green merge to \`main\`:"
              echo
              for name in $missing; do echo "- \`$name\`"; done
              echo
              echo "Setup steps are in \`deploy/aws/runbook.md\`, under *Automatic deploys*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Not configured:$missing — skipping. This is deliberately not a failure."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "workflow_run" ]; then
            ref="$RUN_SHA"
          else
            ref="${INPUT_REF:-main}"
          fi

          # This string is interpolated into a root shell on the instance, so
          # it is checked against what a git ref may contain rather than
          # trusted. A branch name is allowed; a semicolon is not.
          case "$ref" in
            *[!A-Za-z0-9._/-]* | -* | */../* | "")
              echo "Refusing to deploy '$ref': not a plain git ref." >&2
              exit 1 ;;
          esac

          echo "Deploying $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Backend · EC2
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Run the update script on the instance
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail

          # FORCE=1 because send-command has no terminal to answer the
          # in-flight-run prompt with. REPO_REF pins the commit CI passed on.
          printf '{"commands":["sudo FORCE=1 REPO_REF=%s /opt/forecast/deploy/aws/update-backend.sh"]}\n' \
            "$REF" > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions run ${GITHUB_RUN_ID}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $command_id"
          echo "COMMAND_ID=$command_id" >> "$GITHUB_ENV"

          # The script's own health wait runs to 900s, so the built-in
          # command-executed waiter (100s) is far too short to use here.
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)

            case "$status" in
              Success)
                echo "status: Success"
                break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "status: $status"
                echo "DEPLOY_FAILED=1" >> "$GITHUB_ENV"
                break ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Gave up waiting after 25 minutes. The command may still be running on the box."
              echo "DEPLOY_FAILED=1" >> "$GITHUB_ENV"
              break
            fi
            sleep 10
          done

      - name: Report what the instance said
        if: always()
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -uo pipefail
          [ -n "${COMMAND_ID:-}" ] || exit 0

          status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text > deploy.out
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text > deploy.err

          {
            echo "### Deploy $status"
            echo
            echo "Commit \`${{ needs.preflight.outputs.ref }}\`"
            echo
            echo '```'
            cat deploy.out
            if [ -s deploy.err ]; then echo; echo '--- stderr ---'; cat deploy.err; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat deploy.out
          [ -s deploy.err ] && cat deploy.err >&2

          [ -z "${DEPLOY_FAILED:-}" ]
