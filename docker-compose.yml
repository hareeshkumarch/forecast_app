# Forecasting Platform — full stack in one command:
#
#   docker compose up --build
#
#   postgres  → local fallback store, used when Supabase is not configured
#   backend   → FastAPI on :8000 (runs Alembic migrations + seed on boot)
#   frontend  → Next.js App Router on :3000
#
# No Redis, no Celery, no message broker. CPU-bound model training runs in an
# in-process ProcessPoolExecutor (see app/services/job_runner.py), which is the
# right amount of machinery for a single-node POC.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecasting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecasting}
      POSTGRES_DB: ${POSTGRES_DB:-forecasting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, so rows survive `docker compose down` and restarts.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecasting} -d ${POSTGRES_DB:-forecasting}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Broker, result backend and the progress channel the SSE stream reads.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Supabase is the store of record. Set SUPABASE_DB_URL (or SUPABASE_URL +
      # SUPABASE_DB_PASSWORD) and every run, dataset and insight is written
      # there; leave them empty and the local postgres service below is used.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      # Fallback, used when Supabase is unset or unreachable at boot.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Alembic drives migrations synchronously, so it needs the psycopg URL.
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Set false to refuse the fallback and fail the boot instead.
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-true}
      STORAGE_ROOT: /storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-dev-only-insecure-key-change-me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      FORECAST_WORKERS: ${FORECAST_WORKERS:-2}
      RUN_SEED_ON_STARTUP: ${RUN_SEED_ON_STARTUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Set these to move model fitting onto Celery workers. Left empty the
      # API fits in-process, which is fine for one node.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
    volumes:
      # Bind-mounted so uploaded files and generated Parquet/exports are
      # inspectable from the host and survive rebuilds.
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command:
      - celery
      - --app=app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --queues=forecasts
      - --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      # Workers must resolve to the same store as the API, so they take the
      # same Supabase settings and the same fallback.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-true}
      STORAGE_ROOT: /storage
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-dev-only-insecure-key-change-me}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Migrations and seeding belong to the API container, not to workers.
      RUN_SEED_ON_STARTUP: "false"
    volumes:
      # The worker reads the same Parquet the API wrote.
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=app.workers.celery_app.celery_app inspect ping --destination celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Server-side fetches (RSC, route handlers) go over the compose network.
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
