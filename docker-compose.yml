# Forecasting Platform — full stack in one command:
#
#   docker compose up --build
#
#   postgres  → local fallback store, used when Supabase is not configured
#   backend   → FastAPI on :8000 (runs Alembic migrations + seed on boot)
#   frontend  → Next.js App Router on :3000
#
# No Redis, no Celery, no message broker. CPU-bound model training runs in an
# in-process ProcessPoolExecutor (see app/services/job_runner.py), which is the
# right amount of machinery for a single-node POC.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecasting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecasting}
      POSTGRES_DB: ${POSTGRES_DB:-forecasting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, so rows survive `docker compose down` and restarts.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecasting} -d ${POSTGRES_DB:-forecasting}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Broker, result backend and the progress channel the SSE stream reads.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # Time docker allows for a SIGTERM to be honoured before it sends SIGKILL.
    # The default is ten seconds, which is less than the shutdown drain — so
    # without this the API is killed part-way through waiting for the forecasts
    # already running to finish, and the wait buys nothing at all.
    #
    # It has to cover both halves of the shutdown, not just the drain: uvicorn
    # spends up to --timeout-graceful-shutdown (10s, set in entrypoint.sh)
    # closing connections BEFORE lifespan shutdown starts the 45s drain. 10 + 45
    # leaves 20s here for the pools and the engine to close.
    stop_grace_period: 75s
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Supabase is the store of record. Set SUPABASE_DB_URL (or SUPABASE_URL +
      # SUPABASE_DB_PASSWORD) and every run, dataset and insight is written
      # there; leave them empty and the local postgres service below is used.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      # Fallback, used when Supabase is unset or unreachable at boot.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Alembic drives migrations synchronously, so it needs the psycopg URL.
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      # Set false to refuse the fallback and fail the boot instead.
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-true}
      STORAGE_ROOT: /storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-dev-only-insecure-key-change-me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      # Connectors resolve their destination before connecting. Link-local
      # (cloud instance metadata) and loopback are refused whatever this says;
      # this decides whether a warehouse on your own private network is allowed,
      # and it usually is — that is what the product connects to.
      CONNECTOR_ALLOW_PRIVATE_HOSTS: ${CONNECTOR_ALLOW_PRIVATE_HOSTS:-true}
      # Model fits that happen at once. Also the answer to "why has the fourth
      # run not started" — everything past this many waits, and says so.
      FORECAST_WORKERS: ${FORECAST_WORKERS:-2}
      FORECAST_MODEL_CONCURRENCY: ${FORECAST_MODEL_CONCURRENCY:-2}
      # Threads each worker's linear algebra may take. One: OpenBLAS sizes its
      # pool per process, so without this the fits above oversubscribe the box
      # and every one of them runs slower than it would have alone.
      FORECAST_BLAS_THREADS: ${FORECAST_BLAS_THREADS:-1}
      RUN_SEED_ON_STARTUP: ${RUN_SEED_ON_STARTUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Set these to move model fitting onto Celery workers. Left empty the
      # API fits in-process, which is fine for one node.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
      # What the API advertises as its version, and what is mixed into every
      # cache validator. Set it to the build id and each release invalidates
      # clients' stored copies exactly once.
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # Requests in flight before the API answers 503 rather than queueing.
      # Health checks and the progress streams are exempt, so a busy box still
      # reports alive and open dashboards keep their streams.
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-64}
      LOAD_SHEDDING_ENABLED: ${LOAD_SHEDDING_ENABLED:-true}
      # Live connections one account may hold, and how many this process will
      # hold at once. Streams are exempt from both limits above — they are held
      # rather than served — so these are the only thing bounding them.
      SSE_MAX_STREAMS_PER_CLIENT: ${SSE_MAX_STREAMS_PER_CLIENT:-8}
      SSE_MAX_STREAMS_TOTAL: ${SSE_MAX_STREAMS_TOTAL:-256}
      SSE_MAX_LIFETIME_SECONDS: ${SSE_MAX_LIFETIME_SECONDS:-1800}
      # How many proxies of yours stand in front of the API. The client is read
      # that many places from the right of X-Forwarded-For; everything to its
      # left was written before your proxies saw the request, so reading the
      # left of it lets a caller pick its own rate-limit bucket.
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      # Addresses whose forwarding headers are believed at all. Empty believes
      # none of them and counts every caller by the address the socket reports,
      # which behind a proxy is the proxy — so all callers share one bucket.
      # Name the proxy's network to count them apart.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      # /api/health/metrics, in Prometheus' text format. In production an
      # unset token means every scrape is refused rather than served openly.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Dashboard aggregates, cached under a key carrying the run's own
      # revision — memory knobs, not correctness knobs.
      DASHBOARD_CACHE_ENABLED: ${DASHBOARD_CACHE_ENABLED:-true}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-300}
      # The insight rewriter. Off unless a key is set; insights then ship as
      # written. The backend says which at startup.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-400}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10.0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_CONCURRENT_REWRITES: ${LLM_MAX_CONCURRENT_REWRITES:-8}
      LLM_BREAKER_FAILURE_THRESHOLD: ${LLM_BREAKER_FAILURE_THRESHOLD:-4}
      LLM_BREAKER_RESET_SECONDS: ${LLM_BREAKER_RESET_SECONDS:-30.0}
      DASHBOARD_CACHE_MAX_ENTRIES: ${DASHBOARD_CACHE_MAX_ENTRIES:-600}
    volumes:
      # Bind-mounted so uploaded files and generated Parquet/exports are
      # inspectable from the host and survive rebuilds.
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command:
      - celery
      - --app=app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --queues=forecasts
      - --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Workers must resolve to the same store as the API, so they take the
      # same Supabase settings and the same fallback.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecasting}:${POSTGRES_PASSWORD:-forecasting}@postgres:5432/${POSTGRES_DB:-forecasting}
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-true}
      STORAGE_ROOT: /storage
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-dev-only-insecure-key-change-me}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # The worker is where insights are actually rewritten — execute_run reaches
      # _persist_insights here, not in the API. Naming these on the API alone
      # makes the API log "rewriting is on" while the worker that does the work
      # has no key and ships every insight unrewritten.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-400}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10.0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_CONCURRENT_REWRITES: ${LLM_MAX_CONCURRENT_REWRITES:-8}
      LLM_BREAKER_FAILURE_THRESHOLD: ${LLM_BREAKER_FAILURE_THRESHOLD:-4}
      LLM_BREAKER_RESET_SECONDS: ${LLM_BREAKER_RESET_SECONDS:-30.0}
      # Forecast fitting happens here too, so the knobs that size it belong here.
      FORECAST_MODEL_CONCURRENCY: ${FORECAST_MODEL_CONCURRENCY:-1}
      FORECAST_CANDIDATE_WORKERS: ${FORECAST_CANDIDATE_WORKERS:-2}
      FORECAST_BLAS_THREADS: ${FORECAST_BLAS_THREADS:-1}
      # Migrations and seeding belong to the API container, not to workers.
      RUN_SEED_ON_STARTUP: "false"
    volumes:
      # The worker reads the same Parquet the API wrote.
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=app.workers.celery_app.celery_app inspect ping --destination celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Server-side fetches (RSC, route handlers) go over the compose network.
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
